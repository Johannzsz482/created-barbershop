spring.application.name=crafted-barbershop

# --- Database (values come from environment variables; never commit real secrets) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barbershopDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${APP_TIMEZONE:Asia/Manila}}
spring.datasource.username=root
spring.datasource.password=MYSQL_PASSWORD

# --- JPA: Flyway owns the schema; Hibernate only checks that entities match it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Manila}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Profile picture uploads: saved under <upload dir>/avatars (set UPLOAD_DIR to keep them somewhere else) ---
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
